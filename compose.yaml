x-app-environment: &app-environment
    PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
    DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    SITE_URL: ${SITE_URL:-http://localhost:3000}
    HOME_RECENT_DAYS: ${HOME_RECENT_DAYS:-7}
    CRAWL_MAX_RETRIES: ${CRAWL_MAX_RETRIES:-3}
    CRAWL_TIMEOUT_MS: ${CRAWL_TIMEOUT_MS:-30000}
    CRAWL_MAX_MARKDOWN_BYTES: ${CRAWL_MAX_MARKDOWN_BYTES:-1000000}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    LOCAL_STORAGE_DIR: /app/media
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
    app:
        build:
            context: .
            target: runner
        environment: *app-environment
        ports:
            - "3000:3000"
        depends_on:
            migrate:
                condition: service_completed_successfully
        volumes:
            - media_data:/app/media
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    worker:
        build:
            context: .
            target: worker
        environment:
            <<: *app-environment
            PAYLOAD_JOBS_CRON: ${PAYLOAD_JOBS_CRON:-* * * * *}
        depends_on:
            migrate:
                condition: service_completed_successfully

    migrate:
        build:
            context: .
            target: worker
        command: ["npm", "run", "payload", "--", "migrate"]
        environment: *app-environment
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 12

volumes:
    postgres_data:
    media_data:
